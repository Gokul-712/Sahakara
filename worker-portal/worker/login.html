<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker sign in — Sahakari Seva</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/worker.css">
</head>
<body>
<div class="auth-shell">

  <aside class="auth-side">
    <div class="auth-brand"><span class="brand-mark" aria-hidden="true"></span> Sahakari Seva</div>
    <div class="auth-side-content">
      <h2>Welcome back to your cooperative.</h2>
      <p>See today's available jobs, your earnings, and peer training updates — all in one place.</p>
    </div>
    <div class="auth-side-foot">
      New here? <a href="register.html" style="color:var(--teal-300); font-weight:600;" data-i18n="register_as_worker">Register as a worker →</a>
    </div>
  </aside>

  <main class="auth-main">
    <div style="position: absolute; top: 24px; right: 32px;">
      <select class="lang-select" aria-label="Choose language" style="padding:6px 12px; border-radius:4px; border:1px solid var(--grey-300);">
        <option value="en">English</option>
        <option value="ta">தமிழ் (Tamil)</option>
        <option value="hi">हिन्दी (Hindi)</option>
        <option value="kn">ಕನ್ನಡ (Kannada)</option>
        <option value="ml">മലയാളം (Malayalam)</option>
      </select>
    </div>

    <div class="auth-form-wrap" style="max-width: 420px;">
      <div class="form-head">
        <h1 data-i18n="nav_sign_in">Sign in</h1>
        <p>Use the mobile number linked to your worker profile.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginPhone">Mobile number</label>
          <input type="tel" id="loginPhone" placeholder="+91 90000 00000" required>
        </div>
        <div class="field">
          <label for="loginPin">PIN</label>
          <input type="password" id="loginPin" placeholder="4-digit PIN" maxlength="4" required>
        </div>
        <label class="consent-row" style="margin-top:0; margin-bottom: 22px;">
          <input type="checkbox" id="keepSignedIn">
          <span>Keep me signed in on this device</span>
        </label>
        <button type="submit" class="btn btn-teal" style="width:100%;" data-i18n="nav_sign_in">Sign in</button>
      </form>

      <p style="text-align:center; margin-top: 22px; font-size: 0.86rem; color: var(--grey-600);">
        Forgot your PIN? <a href="#" style="color: var(--teal-600); font-weight:600;">Reset via SMS</a>
      </p>
    </div>
  </main>
</div>

<script src="../js/i18n.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
